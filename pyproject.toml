[project]
name = "fishy"
version = "0.1.2"
description = "fishy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["polars>=1.35.2"]

[project.optional-dependencies]
taqsim = ["taqsim", "incidence"]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3", # tests
    "pytest-cov>=6.2.1",
    "ruff>=0.12", # linter + formatter
    "ty>=0.0.66",
]

# -----------------------
# Ruff (lint + format)
# -----------------------
[tool.ruff]
line-length = 120
target-version = "py312"
# extend-exclude = ["notebooks/", "experiments/"]

[tool.ruff.lint]
# Errors, warnings, naming, imports, modern py, bugbear, comprehensions, simplify
select = ["E", "F", "W", "N", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501", # let formatter handle wrapping
    "N803", # allow X, Y for ML-style params
    "N806", # allow X, Y for local vars
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------
# ty (fast static type checker)
# -----------------------
[tool.ty]
[tool.ty.rules]
possibly-unresolved-reference = "warn"

# -----------------------
# Pytest
# -----------------------
[tool.pytest.ini_options]
pythonpath = ["src", "."] # Acceptance tests exercise runnable caller examples.
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.uv]
# Keep uv's cache inside the workspace: agent gate runners sandbox children to
# workspace-write, and uv's default ~/.cache/uv is denied there.
cache-dir = ".uv-cache"

[tool.uv.sources]
taqsim = { git = "https://github.com/hydrosolutions/taqsim.git", rev = "396ad093c2b6f240e702a3b05aee1fb96a69b3f7" }
incidence = { git = "https://github.com/hydrosolutions/incidence.git", subdirectory = "bindings/python", rev = "665da4e0d81ab28921b8d5d2edbb9be27f4ec612" }
# ctrl-freak = { git = "https://github.com/hydrosolutions/ctrl-freak.git", rev = "main" } # example of how to add a git dependency
