[project]
name = "fishy"
version = "0.1.6"
description = "Environmental-flow intelligence for taqsim, including naturalization, IHA metrics, IARI objectives, and DHRAM classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=1.26",
    "taqsim",
]


[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.2.7",
    "deap>=1.4.3",
    "pymoo>=0.6.1.6",
    "pyright>=1.1.408",
    "pytest>=8.3", # tests
    "pytest-cov>=6.2.1",
    "ruff>=0.12", # linter + formatter
]

# -----------------------
# Ruff (lint + format)
# -----------------------
[tool.ruff]
line-length = 120
target-version = "py312"
# extend-exclude = ["notebooks/", "experiments/"]

[tool.ruff.lint]
# Errors, warnings, naming, imports, modern py, bugbear, comprehensions, simplify
select = ["E", "F", "W", "N", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501", # let formatter handle wrapping
    "N803", # allow X, Y for ML-style params
    "N806", # allow X, Y for local vars
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------
# ty (fast static type checker)
# -----------------------
[tool.ty]
[tool.ty.rules]
possibly-unresolved-reference = "warn"

# -----------------------
# Pytest
# -----------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.uv]
# Keep uv's cache inside the workspace: agent gate runners sandbox children to
# workspace-write, and uv's default ~/.cache/uv is denied there.
cache-dir = ".uv-cache"

[tool.uv.sources]
# ctrl-freak = { git = "https://github.com/hydrosolutions/ctrl-freak.git", rev = "main" } # example of how to add a git dependency
